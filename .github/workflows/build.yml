name: Build dashboard

# This repo holds no API keys. RDM's daily workflow (raindelaymedia/roadtrippin) pulls YouTube,
# Instagram and Sprout and pushes the results to schultz_report/data_sr/from_rdm/ — that push
# triggers this build. Manual inputs (X, audio, engaged views) are edited here on the dashboard.
on:
  push:
    branches: [main]
    paths:
      - "schultz_report/data_sr/**"
      - "schultz_report/*.py"
      - "common/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "30 10 * * *"     # 10:30 UTC daily, after RDM's 09:00 run — safety net
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the dashboard
        working-directory: schultz_report
        run: python build_sr_dashboard.py
      - name: Commit the rebuilt dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schultz_report/schultz_report.html
          if git diff --staged --quiet; then echo "No changes"
          else git commit -m "chore: rebuild dashboard [skip ci]" && git pull --rebase -q && git push; fi
